<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .dash { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .ph { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; }
      .btn { fill: #0f766e; }
      .btn2 { fill: #ffffff; stroke: #0f766e; stroke-width: 2; }
      .danger { fill: #e11d48; }
      .t { fill: #0f172a; font-size: 14px; }
      .h { fill: #0f172a; font-size: 20px; font-weight: bold; }
      .s { fill: #64748b; font-size: 11px; }
      .note { fill: #b45309; font-size: 11px; font-style: italic; }
    </style>
  </defs>
  <text x="20" y="28" class="h">Wireframe 3 — Transaction detail (/transactions/:id) and Add/Edit modal</text>
  <text x="20" y="46" class="s">Left: detail view on desktop (2/3 + 1/3 grid; stacks on mobile) · Right: the shared TransactionForm inside a native &lt;dialog&gt;</text>

  <!-- ===== DETAIL ===== -->
  <rect x="20" y="60" width="760" height="560" class="box"/>
  <rect x="20" y="60" width="760" height="44" class="ph"/><text x="35" y="88" class="t">◼ SpendWise        Home   Dashboard   Currency                                 ☾  [ + Add ]</text>
  <text x="40" y="128" class="s">Home / Dashboard / <tspan font-weight="bold">Grocery run</tspan>   ← breadcrumb (aria-current="page")</text>

  <!-- main card -->
  <rect x="40" y="145" width="480" height="440" rx="14" class="dash"/>
  <rect x="40" y="145" width="480" height="8" fill="#f97316"/><text x="530" y="152" class="note">← category colour strip</text>
  <rect x="60" y="175" width="48" height="48" rx="12" class="ph"/>
  <rect x="120" y="175" width="70" height="16" rx="8" class="ph"/><rect x="198" y="175" width="90" height="16" rx="8" class="ph"/><text x="125" y="187" class="s">Expense · Food</text>
  <rect x="120" y="200" width="220" height="24" class="ph"/><text x="125" y="217" class="t">H1 — transaction title</text>
  <rect x="120" y="230" width="200" height="10" class="ph"/><text x="125" y="252" class="s">Thursday, 3 September 2026 · Yesterday</text>
  <rect x="380" y="180" width="120" height="34" class="ph"/><text x="385" y="203" class="t" font-weight="bold">−₹2,340.00</text>
  <line x1="60" y1="275" x2="500" y2="275" stroke="#cbd5e1"/>
  <text x="60" y="298" class="s">PAYMENT METHOD</text><rect x="60" y="305" width="120" height="12" class="ph"/>
  <text x="290" y="298" class="s">DATE</text><rect x="290" y="305" width="120" height="12" class="ph"/>
  <text x="60" y="340" class="s">CATEGORY</text><rect x="60" y="347" width="120" height="12" class="ph"/>
  <text x="290" y="340" class="s">TRANSACTION ID</text><rect x="290" y="347" width="120" height="12" class="ph"/>
  <text x="60" y="382" class="s">NOTES</text><rect x="60" y="389" width="400" height="12" class="ph"/><rect x="60" y="406" width="300" height="12" class="ph"/>
  <line x1="60" y1="440" x2="500" y2="440" stroke="#cbd5e1"/>
  <rect x="60" y="455" width="80" height="34" rx="8" class="btn2"/><text x="78" y="477" class="s">‹ Back</text>
  <rect x="320" y="455" width="80" height="34" rx="8" class="btn2"/><text x="345" y="477" class="s">✎ Edit</text>
  <rect x="410" y="455" width="90" height="34" rx="8" class="danger"/><text x="428" y="477" class="s" fill="#fff">🗑 Delete</text>
  <text x="60" y="520" class="note">Edit → opens modal with pre-filled form · Delete → confirm dialog → navigate('/dashboard')</text>
  <text x="60" y="540" class="note">Unknown id → "Transaction not found" empty-state with link back</text>

  <!-- sidebar -->
  <rect x="535" y="145" width="225" height="150" rx="14" class="dash"/>
  <text x="547" y="167" class="t" font-weight="bold">Insights</text>
  <text x="547" y="190" class="s">Share of all expenses      4.7%</text><rect x="547" y="196" width="200" height="6" rx="3" class="ph"/><rect x="547" y="196" width="10" height="6" rx="3" fill="#f97316"/>
  <text x="547" y="225" class="s">Share of Food &amp; Dining   20.1%</text><rect x="547" y="231" width="200" height="6" rx="3" class="ph"/><rect x="547" y="231" width="40" height="6" rx="3" fill="#f97316"/>
  <text x="547" y="262" class="s">n entries totalling ₹…</text>
  <text x="547" y="285" class="note">role="progressbar" meters</text>

  <rect x="535" y="310" width="225" height="275" rx="14" class="dash"/>
  <text x="547" y="332" class="t" font-weight="bold">More in {category}</text>
  <rect x="547" y="350" width="200" height="34" class="ph"/><rect x="547" y="392" width="200" height="34" class="ph"/><rect x="547" y="434" width="200" height="34" class="ph"/><rect x="547" y="476" width="200" height="34" class="ph"/>
  <text x="547" y="535" class="s">View all transactions ›</text>
  <text x="547" y="565" class="note">up to 4 related links → same route, different :id</text>

  <!-- ===== MODAL ===== -->
  <rect x="820" y="60" width="360" height="560" rx="16" fill="#0f172a" fill-opacity="0.08" stroke="#64748b" stroke-width="2"/>
  <text x="835" y="85" class="s">page dimmed by ::backdrop · focus trapped · Esc closes</text>
  <rect x="845" y="105" width="310" height="490" rx="16" class="box"/>
  <text x="862" y="132" class="t" font-weight="bold">Add transaction</text><text x="1125" y="132" class="t">✕</text>
  <text x="862" y="150" class="s">Record a new income or expense.</text>
  <text x="862" y="178" class="s">Type</text>
  <rect x="862" y="185" width="140" height="32" rx="8" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2"/><text x="900" y="206" class="s">Expense</text>
  <rect x="1010" y="185" width="128" height="32" rx="8" class="ph"/><text x="1050" y="206" class="s">Income</text>
  <text x="862" y="238" class="s">Title</text><rect x="862" y="244" width="276" height="30" rx="6" class="ph"/>
  <text x="862" y="294" class="s">Amount (₹)</text><rect x="862" y="300" width="132" height="30" rx="6" class="ph"/>
  <text x="1006" y="294" class="s">Date</text><rect x="1006" y="300" width="132" height="30" rx="6" class="ph"/>
  <text x="862" y="350" class="s">Category</text><rect x="862" y="356" width="132" height="30" rx="6" class="ph"/>
  <text x="1006" y="350" class="s">Payment method</text><rect x="1006" y="356" width="132" height="30" rx="6" class="ph"/>
  <text x="862" y="406" class="s">Notes (optional)</text><rect x="862" y="412" width="276" height="50" rx="6" class="ph"/>
  <text x="862" y="480" class="s" fill="#e11d48">⚠ Please enter an amount.   ← role="alert", aria-invalid</text>
  <rect x="965" y="540" width="75" height="34" rx="8" class="btn2"/><text x="982" y="562" class="s">Cancel</text>
  <rect x="1050" y="540" width="88" height="34" rx="8" class="btn"/><text x="1070" y="562" class="s" fill="#fff">✓ Save</text>
  <text x="845" y="612" class="note">same component reused for Add (dashboard) and Edit (dashboard + detail)</text>
</svg>
