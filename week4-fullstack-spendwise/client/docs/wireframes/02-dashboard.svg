<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .dash { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .ph { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; }
      .btn { fill: #0f766e; }
      .btn2 { fill: #ffffff; stroke: #0f766e; stroke-width: 2; }
      .t { fill: #0f172a; font-size: 14px; }
      .h { fill: #0f172a; font-size: 20px; font-weight: bold; }
      .s { fill: #64748b; font-size: 11px; }
      .note { fill: #b45309; font-size: 11px; font-style: italic; }
    </style>
  </defs>
  <text x="20" y="28" class="h">Wireframe 2 — User dashboard (/dashboard)</text>
  <text x="20" y="46" class="s">Desktop (≥1280px) left · Mobile right · Add/Edit/Delete happen in a modal dialog</text>

  <!-- ===== DESKTOP ===== -->
  <rect x="20" y="60" width="800" height="620" class="box"/>
  <rect x="20" y="60" width="800" height="44" class="ph"/>
  <text x="35" y="88" class="t">◼ SpendWise        Home   [Dashboard]   Currency                                     ☾  [ + Add ]</text>

  <!-- header row -->
  <circle cx="60" cy="140" r="18" class="ph"/>
  <rect x="90" y="125" width="220" height="18" class="ph"/><text x="95" y="139" class="s">H1 "Good morning, {firstName}!" ← DummyJSON API</text>
  <rect x="90" y="148" width="170" height="10" class="ph"/>
  <rect x="560" y="124" width="110" height="34" rx="8" class="btn2"/><text x="575" y="146" class="s">↻ Reset demo</text>
  <rect x="680" y="124" width="125" height="34" rx="8" class="btn"/><text x="690" y="146" class="s" fill="#fff">+ Add transaction</text>

  <!-- stat cards -->
  <rect x="40" y="180" width="180" height="70" rx="12" fill="#0f766e" stroke="#0f766e"/><text x="52" y="205" class="s" fill="#ccfbf1">Total balance</text><text x="52" y="230" class="t" fill="#fff" font-weight="bold">₹ 3,95,375</text>
  <rect x="235" y="180" width="180" height="70" rx="12" class="dash"/><text x="247" y="205" class="s">Total income</text><rect x="247" y="215" width="100" height="18" class="ph"/>
  <rect x="430" y="180" width="180" height="70" rx="12" class="dash"/><text x="442" y="205" class="s">Total expenses</text><rect x="442" y="215" width="100" height="18" class="ph"/>
  <rect x="625" y="180" width="180" height="70" rx="12" class="dash"/><text x="637" y="205" class="s">This month</text><rect x="637" y="215" width="100" height="18" class="ph"/>
  <text x="40" y="268" class="note">grid: 4 cols (xl) → 2 cols (sm) → 1 col</text>

  <!-- charts -->
  <rect x="40" y="280" width="460" height="170" rx="12" class="dash"/>
  <text x="52" y="300" class="t" font-weight="bold">Income vs expenses (bar chart, 6 months)</text>
  <rect x="70" y="360" width="18" height="70" class="ph"/><rect x="92" y="400" width="18" height="30" class="ph"/>
  <rect x="140" y="340" width="18" height="90" class="ph"/><rect x="162" y="410" width="18" height="20" class="ph"/>
  <rect x="210" y="350" width="18" height="80" class="ph"/><rect x="232" y="405" width="18" height="25" class="ph"/>
  <rect x="280" y="330" width="18" height="100" class="ph"/><rect x="302" y="395" width="18" height="35" class="ph"/>
  <rect x="350" y="345" width="18" height="85" class="ph"/><rect x="372" y="412" width="18" height="18" class="ph"/>
  <rect x="420" y="338" width="18" height="92" class="ph"/><rect x="442" y="400" width="18" height="30" class="ph"/>
  <text x="52" y="445" class="s">sr-only &lt;table&gt; mirrors the chart for screen readers</text>

  <rect x="515" y="280" width="290" height="170" rx="12" class="dash"/>
  <text x="527" y="300" class="t" font-weight="bold">Spending by category</text>
  <circle cx="590" cy="375" r="45" fill="none" stroke="#94a3b8" stroke-width="16"/>
  <rect x="655" y="330" width="130" height="10" class="ph"/><rect x="655" y="348" width="130" height="10" class="ph"/><rect x="655" y="366" width="130" height="10" class="ph"/><rect x="655" y="384" width="130" height="10" class="ph"/><rect x="655" y="402" width="130" height="10" class="ph"/>
  <text x="655" y="428" class="s">legend = real text list</text>

  <!-- filter bar -->
  <text x="40" y="478" class="t" font-weight="bold">Transactions</text>
  <rect x="40" y="488" width="765" height="44" rx="10" class="dash"/>
  <rect x="50" y="497" width="330" height="26" rx="6" class="ph"/><text x="60" y="514" class="s">🔍 search…</text>
  <rect x="390" y="497" width="110" height="26" rx="6" class="ph"/><text x="400" y="514" class="s">type ▾</text>
  <rect x="510" y="497" width="130" height="26" rx="6" class="ph"/><text x="520" y="514" class="s">category ▾</text>
  <rect x="650" y="497" width="145" height="26" rx="6" class="ph"/><text x="660" y="514" class="s">sort ▾</text>

  <!-- list -->
  <rect x="40" y="542" width="765" height="128" rx="10" class="dash"/>
  <g>
    <rect x="52" y="552" width="28" height="28" rx="8" class="ph"/><rect x="90" y="554" width="180" height="12" class="ph"/><rect x="90" y="571" width="120" height="8" class="ph"/><rect x="640" y="558" width="90" height="14" class="ph"/><text x="745" y="570" class="s">✎ 🗑</text>
    <line x1="52" y1="590" x2="793" y2="590" stroke="#cbd5e1"/>
    <rect x="52" y="600" width="28" height="28" rx="8" class="ph"/><rect x="90" y="602" width="200" height="12" class="ph"/><rect x="90" y="619" width="100" height="8" class="ph"/><rect x="640" y="606" width="90" height="14" class="ph"/><text x="745" y="618" class="s">✎ 🗑</text>
    <line x1="52" y1="638" x2="793" y2="638" stroke="#cbd5e1"/>
    <text x="370" y="660" class="s">[ Show more (n remaining) ]</text>
  </g>
  <text x="40" y="694" class="note">row = link to /transactions/:id · hover reveals edit/delete · 8 per page</text>

  <!-- ===== MOBILE ===== -->
  <rect x="880" y="60" width="290" height="620" rx="24" class="box"/>
  <rect x="880" y="60" width="290" height="44" class="ph"/><text x="895" y="88" class="t">◼ SpendWise          ☾ ≡</text>
  <circle cx="912" cy="130" r="14" class="ph"/><rect x="935" y="120" width="180" height="14" class="ph"/><rect x="935" y="139" width="120" height="8" class="ph"/>
  <rect x="900" y="160" width="80" height="30" rx="8" class="btn2"/><rect x="990" y="160" width="160" height="30" rx="8" class="btn"/>
  <rect x="900" y="205" width="250" height="52" rx="12" fill="#0f766e" stroke="#0f766e"/>
  <rect x="900" y="265" width="250" height="52" rx="12" class="dash"/>
  <rect x="900" y="325" width="250" height="52" rx="12" class="dash"/>
  <text x="915" y="355" class="s">… (4 stat cards stacked)</text>
  <rect x="900" y="390" width="250" height="90" rx="12" class="dash"/><text x="915" y="410" class="s">bar chart (full width)</text>
  <rect x="900" y="490" width="250" height="90" rx="12" class="dash"/><text x="915" y="510" class="s">donut + legend stacked</text>
  <rect x="900" y="592" width="250" height="34" rx="8" class="dash"/><text x="915" y="613" class="s">🔍 search · filters stack vertically</text>
  <rect x="900" y="634" width="250" height="36" rx="8" class="dash"/><text x="915" y="656" class="s">list rows (tap → detail)  ›</text>

</svg>
