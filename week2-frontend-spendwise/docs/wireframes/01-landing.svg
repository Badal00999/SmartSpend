<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .dash { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .ph { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; }
      .btn { fill: #0f766e; }
      .btn2 { fill: #ffffff; stroke: #0f766e; stroke-width: 2; }
      .t { fill: #0f172a; font-size: 14px; }
      .h { fill: #0f172a; font-size: 20px; font-weight: bold; }
      .s { fill: #64748b; font-size: 11px; }
      .note { fill: #b45309; font-size: 11px; font-style: italic; }
    </style>
  </defs>
  <!-- Title -->
  <text x="20" y="28" class="h">Wireframe 1 — Landing page (/)</text>
  <text x="20" y="46" class="s">Desktop (≥1024px) on the left · Mobile (&lt;640px) on the right</text>

  <!-- ===== DESKTOP ===== -->
  <rect x="20" y="60" width="800" height="540" class="box"/>
  <!-- navbar -->
  <rect x="20" y="60" width="800" height="50" class="ph"/>
  <text x="35" y="90" class="t">◼ SpendWise</text>
  <text x="330" y="90" class="t">Home   Dashboard   Currency</text>
  <text x="700" y="90" class="t">☾  [ + Add ]</text>
  <!-- hero left -->
  <rect x="45" y="140" width="150" height="20" rx="10" class="dash"/>
  <text x="55" y="154" class="s">badge / tagline</text>
  <rect x="45" y="175" width="330" height="30" class="ph"/><text x="50" y="196" class="t">H1 — Know exactly where your money goes</text>
  <rect x="45" y="212" width="300" height="12" class="ph"/>
  <rect x="45" y="230" width="280" height="12" class="ph"/>
  <rect x="45" y="248" width="200" height="12" class="ph"/>
  <rect x="45" y="280" width="150" height="40" rx="8" class="btn"/><text x="60" y="305" class="t" fill="#fff">Open dashboard →</text>
  <rect x="205" y="280" width="160" height="40" rx="8" class="btn2"/><text x="220" y="305" class="t">+ Add transaction</text>
  <line x1="45" y1="345" x2="375" y2="345" stroke="#cbd5e1"/>
  <text x="45" y="368" class="s">Balance</text><text x="160" y="368" class="s">Income</text><text x="275" y="368" class="s">Expenses</text>
  <rect x="45" y="375" width="90" height="16" class="ph"/><rect x="160" y="375" width="90" height="16" class="ph"/><rect x="275" y="375" width="90" height="16" class="ph"/>
  <text x="45" y="410" class="note">live totals from TransactionsContext</text>
  <!-- hero right illustration -->
  <rect x="430" y="140" width="360" height="250" rx="16" class="dash"/>
  <text x="445" y="165" class="s">Illustration card (dashboard mock)</text>
  <rect x="450" y="185" width="120" height="20" class="ph"/>
  <rect x="450" y="220" width="30" height="60" class="ph"/><rect x="490" y="200" width="30" height="80" class="ph"/><rect x="530" y="230" width="30" height="50" class="ph"/><rect x="570" y="190" width="30" height="90" class="ph"/><rect x="610" y="215" width="30" height="65" class="ph"/>
  <rect x="450" y="300" width="320" height="14" class="ph"/><rect x="450" y="322" width="320" height="14" class="ph"/><rect x="450" y="344" width="320" height="14" class="ph"/>
  <rect x="410" y="360" width="130" height="60" rx="10" class="dash"/><text x="420" y="395" class="s">floating FX card</text>
  <!-- features -->
  <text x="330" y="450" class="t" font-weight="bold">Features (4-col grid → 2-col → 1-col)</text>
  <rect x="45" y="465" width="175" height="110" rx="12" class="dash"/>
  <rect x="235" y="465" width="175" height="110" rx="12" class="dash"/>
  <rect x="425" y="465" width="175" height="110" rx="12" class="dash"/>
  <rect x="615" y="465" width="175" height="110" rx="12" class="dash"/>
  <text x="60" y="490" class="s">icon · title · text</text>
  <text x="45" y="595" class="s">↓ below the fold: "How it works" (3 steps) · CTA banner · footer</text>

  <!-- ===== MOBILE ===== -->
  <rect x="880" y="60" width="290" height="540" rx="24" class="box"/>
  <rect x="880" y="60" width="290" height="46" class="ph"/>
  <text x="895" y="88" class="t">◼ SpendWise</text><text x="1110" y="88" class="t">☾ ≡</text>
  <rect x="900" y="130" width="120" height="16" rx="8" class="dash"/>
  <rect x="900" y="160" width="250" height="26" class="ph"/><rect x="900" y="192" width="220" height="26" class="ph"/>
  <rect x="900" y="230" width="250" height="10" class="ph"/><rect x="900" y="246" width="230" height="10" class="ph"/><rect x="900" y="262" width="180" height="10" class="ph"/>
  <rect x="900" y="290" width="250" height="40" rx="8" class="btn"/><text x="960" y="315" class="t" fill="#fff">Open dashboard →</text>
  <rect x="900" y="340" width="250" height="40" rx="8" class="btn2"/><text x="955" y="365" class="t">+ Add transaction</text>
  <line x1="900" y1="400" x2="1150" y2="400" stroke="#cbd5e1"/>
  <rect x="900" y="412" width="70" height="26" class="ph"/><rect x="990" y="412" width="70" height="26" class="ph"/><rect x="1080" y="412" width="70" height="26" class="ph"/>
  <rect x="900" y="460" width="250" height="120" rx="12" class="dash"/>
  <text x="915" y="485" class="s">illustration card (stacked)</text>
  <text x="915" y="505" class="s">then features 1-col …</text>
  <text x="880" y="615" class="note">hamburger ≡ opens vertical menu; full-width buttons</text>
</svg>
