<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .dash { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .ph { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; }
      .btn { fill: #0f766e; }
      .btn2 { fill: #ffffff; stroke: #0f766e; stroke-width: 2; }
      .t { fill: #0f172a; font-size: 14px; }
      .h { fill: #0f172a; font-size: 20px; font-weight: bold; }
      .s { fill: #64748b; font-size: 11px; }
      .note { fill: #b45309; font-size: 11px; font-style: italic; }
    </style>
  </defs>
  <text x="20" y="28" class="h">Wireframe 4 — Currency converter (/convert) · live public API</text>
  <text x="20" y="46" class="s">Fetch → loading skeleton → result / error + retry. Desktop left, mobile right.</text>

  <rect x="20" y="60" width="800" height="440" class="box"/>
  <rect x="20" y="60" width="800" height="44" class="ph"/><text x="35" y="88" class="t">◼ SpendWise        Home   Dashboard   [Currency]                                  ☾  [ + Add ]</text>
  <rect x="40" y="120" width="260" height="24" class="ph"/><text x="45" y="137" class="t">H1 — Currency converter</text>
  <rect x="40" y="150" width="420" height="10" class="ph"/>

  <!-- converter card -->
  <rect x="40" y="180" width="460" height="300" rx="14" class="dash"/>
  <text x="55" y="203" class="s">Amount</text><rect x="55" y="210" width="430" height="36" rx="6" class="ph"/>
  <text x="55" y="262" class="s">Use my balance (₹…)</text>
  <text x="55" y="285" class="s">From</text><rect x="55" y="292" width="180" height="32" rx="6" class="ph"/>
  <rect x="250" y="292" width="32" height="32" rx="8" class="btn2"/><text x="258" y="313" class="s">⇅</text>
  <text x="300" y="285" class="s">To</text><rect x="300" y="292" width="185" height="32" rx="6" class="ph"/>
  <rect x="55" y="340" width="430" height="120" rx="14" fill="#0f766e"/>
  <text x="70" y="365" class="s" fill="#ccfbf1">₹1,000.00 equals</text>
  <text x="70" y="400" class="t" fill="#fff" font-weight="bold" font-size="26">$10.58</text>
  <text x="70" y="430" class="s" fill="#ccfbf1">1 INR = 0.0106 USD · Updated 3 Sept 2026</text>
  <text x="70" y="450" class="note" fill="#fde68a">aria-live region · skeleton while loading · error + "Try again"</text>

  <!-- rates table -->
  <rect x="515" y="180" width="290" height="300" rx="14" class="dash"/>
  <text x="530" y="203" class="t" font-weight="bold">1 INR in other currencies</text><text x="780" y="203" class="s">↻</text>
  <g>
    <rect x="530" y="220" width="130" height="12" class="ph"/><rect x="720" y="220" width="70" height="12" class="ph"/>
    <rect x="530" y="245" width="130" height="12" class="ph"/><rect x="720" y="245" width="70" height="12" class="ph"/>
    <rect x="530" y="270" width="130" height="12" class="ph"/><rect x="720" y="270" width="70" height="12" class="ph"/>
    <rect x="530" y="295" width="130" height="12" class="ph"/><rect x="720" y="295" width="70" height="12" class="ph"/>
    <rect x="530" y="320" width="130" height="12" class="ph"/><rect x="720" y="320" width="70" height="12" class="ph"/>
    <rect x="530" y="345" width="130" height="12" class="ph"/><rect x="720" y="345" width="70" height="12" class="ph"/>
    <rect x="530" y="370" width="130" height="12" class="ph"/><rect x="720" y="370" width="70" height="12" class="ph"/>
    <rect x="530" y="395" width="130" height="12" class="ph"/><rect x="720" y="395" width="70" height="12" class="ph"/>
  </g>
  <text x="530" y="440" class="note">each row is a button → sets "To" currency</text>
  <text x="530" y="460" class="note">one request per base currency (debounced amount)</text>

  <!-- mobile -->
  <rect x="880" y="60" width="290" height="440" rx="24" class="box"/>
  <rect x="880" y="60" width="290" height="44" class="ph"/><text x="895" y="88" class="t">◼ SpendWise          ☾ ≡</text>
  <rect x="900" y="120" width="200" height="20" class="ph"/>
  <rect x="900" y="150" width="250" height="220" rx="12" class="dash"/>
  <rect x="912" y="165" width="226" height="30" rx="6" class="ph"/>
  <rect x="912" y="205" width="95" height="28" rx="6" class="ph"/><rect x="1015" y="205" width="28" height="28" rx="6" class="btn2"/><rect x="1050" y="205" width="88" height="28" rx="6" class="ph"/>
  <rect x="912" y="245" width="226" height="110" rx="10" fill="#0f766e"/>
  <rect x="900" y="380" width="250" height="110" rx="12" class="dash"/><text x="915" y="400" class="s">rates table (stacked)</text>
</svg>
